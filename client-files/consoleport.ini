; ConsolePort for SWG Infinity - the module's settings.
; The file is read from the swgemu.exe directory on the first frame. There is no
; re-reading: change it and restart the client.
;
; The keys fall into three groups: working ones, rig ones and emergency switches.
; Anything not listed takes the default from cp::Config (runtime.h).

[consoleport]

; ---------------------------------------------------------------- working
; The pad profile: ds4 | steam.
; ds4   - a DualSense/DS4 directly: CROSS 0, CIRCLE 1, SQUARE 2, TRIANGLE 3,
;         L1 4, R1 5, the D-pad on POV 0, the triggers on separate axes.
; steam - the pad arrived through Steam Input: the game sees a virtual Xbox pad,
;         which has a different button numbering and the triggers on ONE axis.
; It is also detected automatically: if the device's VID is 0x28DE (Valve), the
; profile switches by itself without waiting for this line.
profile=ds4

; The crossbar: two clusters of diamonds on the stock toolbar, flyouts on holding L2/R2.
crossbar=1

; The UI cursor: the pad drives any desktop window (the D-pad across the widgets,
; the buttons become synthetic input the client already accepts).
cursor=1

; The character selection screen under the pad: a fixed layout instead of the
; cursor. It works before entering the world, when there is no toolbar yet and the
; window stack is not up.
charSelect=1

; The on-screen keyboard: L3+R3, or cross on an input field.
keyboard=1

; Text binding labels on the slots. The button and modifier glyphs say everything,
; so this is off by default; turn it on while rebinding.
bindBadges=0

; The live cpDebug window in the HUD: the set, the target, the ring, the pad, the theme.
; Turn it off for a player, it is useful for review.
debugWindow=1

; Names of pages that are NOT to be treated as windows (comma separated). The
; module knows the HUD furniture itself, but a server build may have a permanent
; panel of its own - and then the pad goes into UI mode for good. The name shows
; up in the trace: "desktop: ... NAME:WINDOW".
uiSkip=

; ---------------------------------------------------------------- targeting on the bumpers
; LB / RB          - the previous / next target over all creatures
; L2 + LB/RB       - attackables only (enemies)
; R2 + LB/RB       - friendlies only (non-attackable non-enemies)
; hold LB          - the group ring, selected with the right stick, applied on release
targeting=1
; The bumper hold threshold, milliseconds. 300 was set by the user on 9 Sep: a
; second felt like sticking.
targetHoldMs=300
targetRingLeft=1
targetRingRight=1
; The bar saying "what the bumpers do right now", under the crossbar.
targetModeBar=1
; The right cross's face buttons for actions on a peaceful target.
targetContext=1

; ---------------------------------------------------------------- emergency switches
; The UIVolumePage::Pack interception. Without it the toolbar volume repacks the
; cells on its own grid every frame and the diamonds go askew - but it shows
; whether it is what kills the client.
; The details and the side effect (a frozen mWidgetCount) are in docs/02-hooks.md.
packHook=1

; The GetDeviceData interception (pad input). 0 leaves the module in place with no input.
padHook=1

; The DirectInput trigger axes, if the auto-detection missed.
; -1 = work it out ourselves. Native HID has canonical axes and needs no key.
trigAxisL=-1
trigAxisR=-1

; ---------------------------------------------------------------- rig
; Needed when working remotely with nothing to point with. A player needs none of these.

; Show GroundHUD+Toolbar on the login screen, without logging in.
previewAtLogin=1

; Open a flyout with no pad: -1 off, >=0 hold this cluster's flyout,
; -2 walk the clusters in a loop.
previewFan=-1
; Have the flyout read this pane instead of L2 / L2+R2 / R2.
previewFanPane=-1
; Copy a cluster's item into the L2 layer once / clear the L2 layer once.
previewAssign=-1
previewClear=-1
